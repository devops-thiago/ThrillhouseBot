review:
  # Archived docs versions are frozen copies of an earlier release's docs: the released-history
  # check keeps them unchanged once added, so there is nothing to review in them. The globs take
  # the X.Y.Z shape of an archive's name; the current docs (website/src/content/docs/*.md and its
  # named subfolders) are still reviewed.
  ignored-files:
    - "website/src/content/docs/[0-9]*.[0-9]*.[0-9]*/**"
    - "website/src/assets/[0-9]*.[0-9]*.[0-9]*/**"
    - "website/src/content/versions/[0-9]*.[0-9]*.[0-9]*.json"

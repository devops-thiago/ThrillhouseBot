name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to (re-)release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devops-thiago/thrillhousebot

jobs:
  # Decides whether the tag may be released, and fixes what is released: the commit the tag
  # points at and the digests of the two images main CI built from it. Every later job works
  # from those values, never from a tag name, so nothing can be swapped in between.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      digest: ${{ steps.images.outputs.digest }}
      digest_distroless: ${{ steps.images.outputs.digest_distroless }}
    steps:
      - name: Validate version is semver
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a semver tag like v0.1.0, got '$VERSION'"
            exit 1
          fi
      # refs/tags/ in full: a bare name would pick a branch of the same name first. Full
      # history, because the tag has to be an ancestor of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      # The checker comes from the workflow's own ref, not from the tag being judged. Nothing
      # in this job runs code from the tagged tree: pom.xml is read, not built.
      - name: Check out the release scripts from the workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .workflow-ref
          sparse-checkout: scripts/release
          persist-credentials: false
      # Refuses a tag that is not on main, is not a signed tag from one of the accounts
      # below, does not match pom.xml, or a run started from a ref other than the tag or main.
      - name: Check the tag is a signed release tag on main
        id: meta
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub logins whose published SSH signing keys may sign a release tag.
          RELEASE_TAG_SIGNERS: devops-thiago
        run: node .workflow-ref/scripts/release/check-tag.mjs
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: devops-thiago
          password: ${{ secrets.GITHUB_TOKEN }}
      # crane moves and reads image tags. The archive is checked against a pinned SHA-256
      # before anything is unpacked from it.
      - name: Install crane
        env:
          CRANE_VERSION: "0.20.6"
          CRANE_SHA256: "c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          sudo install "$RUNNER_TEMP/crane" /usr/local/bin/crane
      # The :<sha> tags are only where to look. What makes an image releasable is the
      # provenance ci.yml attached when it built it: signed by that workflow, on main, from
      # exactly the tagged commit. An image pushed under the same tag by anything else has
      # no such attestation and stops the release here.
      - name: Check main CI built both images from the tagged commit
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for variant in default distroless; do
            ref="${IMAGE}:${SHA}"
            output=digest
            if [ "$variant" = distroless ]; then
              ref="${ref}-distroless"
              output=digest_distroless
            fi
            if ! digest=$(crane digest "$ref"); then
              echo "::error::No image ${ref} in GHCR. Wait for main CI to finish, then re-run"
              exit 1
            fi
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected digest for ${ref}: ${digest}"
              exit 1
            fi
            if ! gh attestation verify "oci://${IMAGE}@${digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
              --source-ref refs/heads/main \
              --source-digest "$SHA" \
              --deny-self-hosted-runners; then
              echo "::error::${ref} (${digest}) has no provenance from ci.yml on main for ${SHA}. Images built before the provenance step was added cannot be released again (docs/RELEASING.md)"
              exit 1
            fi
            echo "${output}=${digest}" >> "$GITHUB_OUTPUT"
          done

  scan:
    needs: [verify]
    runs-on: ubuntu-latest
    # No security-events: the scans below gate the release and upload no SARIF.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      # The trivy-scan composite action is referenced locally below. Local
      # actions resolve from the checked-out tree, but the tag above can predate
      # the action (e.g. re-releasing an old tag via workflow_dispatch). Check it
      # out from the workflow's own ref into a side path so it always resolves.
      - name: Check out reusable actions from the workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .actions-ref
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Resolve Trivy ignore policy for tagged commit
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if [ -f .trivyignore ]; then
            echo "Using .trivyignore from ${TAG}"
            exit 0
          fi
          git fetch origin main --depth=1
          if git show origin/main:.trivyignore > .trivyignore 2>/dev/null; then
            echo "Tag has no .trivyignore; using scan policy from origin/main"
          else
            echo "::error::No .trivyignore on ${TAG} or origin/main"
            exit 1
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: devops-thiago
          password: ${{ secrets.GITHUB_TOKEN }}
      # These scans are the release gate (exit-code 1 on CRITICAL/HIGH) and upload no
      # SARIF to code scanning (#869). Code scanning measures a category's staleness
      # against the default branch, and this job only ever runs on a tag, so an upload
      # here never refreshes the category on main: the Security tab reported
      # trivy-release and trivy-release-distroless as stale from the day they stopped
      # being uploaded from main. main is already covered by trivy-image and
      # trivy-image-distroless in ci.yml (every push) and by security-scan.yml (daily).
      # Do not re-add the upload; the SARIF is kept as a run artifact below instead.
      # `category` only names the SARIF file when upload is false.
      #
      # Scanned by digest, the same digests promote tags and signs.
      - name: Scan default image (gate on CRITICAL/HIGH)
        uses: ./.actions-ref/.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.verify.outputs.digest }}
          scanners: vuln
          exit-code: "1"
          trivyignores: .trivyignore
          category: trivy-release
          upload: "false"
      - name: Scan distroless image (gate on CRITICAL/HIGH)
        uses: ./.actions-ref/.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.verify.outputs.digest_distroless }}
          scanners: vuln
          exit-code: "1"
          trivyignores: .trivyignore
          category: trivy-release-distroless
          upload: "false"
      # Keep the reports with the run, including when a scan fails the gate, so the
      # findings that stopped a release can be read without re-running it.
      - name: Keep Trivy SARIF reports with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-release-sarif
          path: |
            trivy-release.sarif
            trivy-release-distroless.sarif
          if-no-files-found: ignore
          retention-days: 90

  promote:
    needs: [verify, scan]
    runs-on: ubuntu-latest
    # The jobs that publish run in the `release` environment, so its protection rules
    # (required reviewers, allowed branches and tags) apply to them. See docs/RELEASING.md.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      update_latest: ${{ steps.promote.outputs.update_latest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: devops-thiago
          password: ${{ secrets.GITHUB_TOKEN }}
      # crane moves and reads image tags. The archive is checked against a pinned SHA-256
      # before anything is unpacked from it.
      - name: Install crane
        env:
          CRANE_VERSION: "0.20.6"
          CRANE_SHA256: "c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          sudo install "$RUNNER_TEMP/crane" /usr/local/bin/crane
      - name: Promote image tags
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          DIGEST: ${{ needs.verify.outputs.digest }}
          DIGEST_DISTROLESS: ${{ needs.verify.outputs.digest_distroless }}
        run: |
          NEW_VER="${TAG#v}"

          # A published version tag is never moved. Running the release again for the same
          # images is a no-op here; a version tag that already names other images (main CI
          # was re-run and rebuilt them, or someone retagged) stops the release.
          release_tag() {
            local name="$1" digest="$2" current
            if current=$(crane digest "${IMAGE}:${name}" 2>/dev/null) && [ "$current" != "$digest" ]; then
              echo "::error::${IMAGE}:${name} is already published as ${current}; this release would move it to ${digest}. See docs/RELEASING.md (Running a release again)"
              exit 1
            fi
            crane tag "${IMAGE}@${digest}" "${name}"
            current=$(crane digest "${IMAGE}:${name}")
            if [ "$current" != "$digest" ]; then
              echo "::error::${IMAGE}:${name} reads back as ${current}, expected ${digest}"
              exit 1
            fi
          }
          release_tag "${TAG}" "${DIGEST}"
          release_tag "${TAG}-distroless" "${DIGEST_DISTROLESS}"

          # :latest, the docs site and the version bump follow the highest release, so a patch
          # cut on an older line must not take them. Only vMAJOR.MINOR.PATCH releases compete:
          # `sort -V` ranks a pre-release (v0.6.8-rc1) or a floating tag (nightly) above the
          # plain version, which would read a legitimate release as older than the highest one
          # and skip the docs deploy and the bump with nothing said (#733). The verify job holds
          # TAG to that shape, so the new version always takes part. sed rather than grep: under
          # pipefail a filter that matches nothing (first release) must not fail the step.
          UPDATE_LATEST=true
          HIGHEST_VER=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName -q '.[].tagName' \
            | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V \
            | tail -1)
          if [ -n "$HIGHEST_VER" ]; then
            HIGHEST=$(printf '%s\n%s' "$HIGHEST_VER" "$NEW_VER" | sort -V | tail -1)
            if [ "$HIGHEST" != "$NEW_VER" ]; then
              UPDATE_LATEST=false
            fi
          fi

          # The outcome is a decision either way, and the jobs it gates (publish-docs,
          # bump-version) are skipped on false, which says nothing on its own. Record it where
          # a reader looks: the run summary and a notice annotation (#733).
          if [ "$UPDATE_LATEST" = true ]; then
            crane tag "${IMAGE}@${DIGEST}" latest
            crane tag "${IMAGE}@${DIGEST_DISTROLESS}" latest-distroless
            DECISION="${TAG} is the highest release${HIGHEST_VER:+ (previously v${HIGHEST_VER})}: :latest, the docs site and the version bump follow it"
          else
            DECISION="${TAG} is a release on an older line, below v${HIGHEST_VER}: :latest, the docs site and the version bump stay where they are (see docs/RELEASING.md to republish the docs by hand)"
          fi
          echo "::notice title=Promotion::${DECISION}"
          {
            printf '## Promotion\n\n%s\n\n' "${DECISION}"
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| ${IMAGE}:${TAG} | ${DIGEST} |"
            echo "| ${IMAGE}:${TAG}-distroless | ${DIGEST_DISTROLESS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "update_latest=${UPDATE_LATEST}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Signed and attested by the digests verify resolved, not by reading the tags back.
      - name: Sign images (keyless via Sigstore)
        env:
          DIGEST: ${{ needs.verify.outputs.digest }}
          DIGEST_DISTROLESS: ${{ needs.verify.outputs.digest_distroless }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST_DISTROLESS}"
      - name: Attest default image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.verify.outputs.digest }}
          push-to-registry: true
      - name: Attest distroless image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.verify.outputs.digest_distroless }}
          push-to-registry: true

  release:
    needs: [verify, promote]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: devops-thiago
          password: ${{ secrets.GITHUB_TOKEN }}
      # The binaries come out of the image verify resolved and promote signed, by digest.
      - name: Extract native binaries from image
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: |
          mkdir -p dist
          for ARCH in amd64 arm64; do
            STAGE="thrillhousebot-${TAG}-linux-${ARCH}"
            mkdir -p "${STAGE}"
            docker pull --platform "linux/${ARCH}" "${IMAGE}@${DIGEST}"
            CID=$(docker create --platform "linux/${ARCH}" "${IMAGE}@${DIGEST}")
            docker cp "${CID}:/work/application" "${STAGE}/thrillhousebot"
            docker rm "${CID}"
            cp LICENSE README.md "${STAGE}/"
            tar -czf "dist/${STAGE}.tar.gz" -C "${STAGE}" .
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
          ls -la dist/
      - name: Attest binary provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Stage provenance as a release asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.intoto.jsonl
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign artifacts
        run: |
          for f in dist/*.tar.gz dist/checksums.txt; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "$f"
          done
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            /^## \[/ { found=0 }
            found
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::No CHANGELOG.md content found for ${VERSION}"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          UPDATE_LATEST: ${{ needs.promote.outputs.update_latest }}
        run: |
          shopt -s nullglob
          artifacts=( dist/*.tar.gz dist/checksums.txt dist/*.sigstore dist/*.intoto.jsonl )
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "::error::No release artifacts found in dist/"
            exit 1
          fi

          # Curated CHANGELOG notes first, then GitHub's generated section — the merged-PR list
          # and, the point of this, "New Contributors". Generated explicitly rather than with
          # `gh release create --generate-notes` because `gh release edit` has no such flag: the
          # re-run path below would otherwise overwrite the body and drop the credit. Shaped by
          # .github/release.yml. Best-effort — a failure here must not fail the release.
          cp release_notes.md release_body.md
          if generated=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body 2>/dev/null) && [ -n "$generated" ]; then
            printf '\n\n%s\n' "$generated" >> release_body.md
          else
            echo "::warning::Could not generate release notes; publishing CHANGELOG notes only"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading artifacts and refreshing notes"
            gh release upload "$TAG" "${artifacts[@]}" --clobber
            edit_args=( "$TAG" --notes-file release_body.md )
            if [ "$UPDATE_LATEST" = "true" ]; then
              edit_args+=( --latest )
            else
              edit_args+=( --latest=false )
            fi
            gh release edit "${edit_args[@]}"
          else
            args=( "$TAG" --notes-file release_body.md )
            if [ "$UPDATE_LATEST" = "true" ]; then
              args+=( --latest )
            else
              args+=( --latest=false )
            fi
            args+=( "${artifacts[@]}" )
            gh release create "${args[@]}"
          fi

  # The Docs workflow's `release: published` trigger does not fire for the
  # release created above: it is created with the default GITHUB_TOKEN, and
  # GitHub suppresses workflow runs for events that token raises — the same
  # guard that keeps CI from starting on the bump PR below. In the repo's whole
  # history that trigger has never once fired, so every release through v0.6.2
  # published its docs by hand. workflow_dispatch is exempt from the guard, so
  # the deploy is dispatched explicitly here. The trigger stays on docs.yml for
  # a release published by hand in the UI, which does fire it.
  #
  # Gated on update_latest for the same reason as the bump: the live site tracks
  # the highest release, so a patch cut on an older line must not republish the
  # site from its tag.
  publish-docs:
    needs: [verify, release, promote]
    if: needs.promote.outputs.update_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      # write to dispatch the run, read to poll for it and watch it
      actions: write
    steps:
      - name: Deploy the docs from the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # The dispatch only queues the run: `gh workflow run` exits 0 as soon
          # as GitHub accepts it. The failure this job exists to catch happens
          # later, inside the deploy — most likely the github-pages environment
          # refusing the tag, which needs a `v*` policy alongside the `main`
          # branch rule and produces "not allowed to deploy to github-pages due
          # to environment protection rules". Waiting for the run is therefore
          # the whole point: exiting on the dispatch would reproduce the silent
          # miss that left the site four versions behind, just one step later.
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

          # The dispatch returns no run id, so resolve it by polling for a run
          # of this workflow on this tag created at or after the dispatch. The
          # created-after bound is what keeps an earlier manual republish of the
          # same tag from being mistaken for this one.
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docs.yml \
              --branch "$TAG" --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$before\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::Dispatched docs.yml against $TAG but no run appeared within 5 minutes"
            exit 1
          fi

          echo "Watching docs run $run_id for $TAG"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

  bump-version:
    needs: [verify, release, promote]
    if: needs.promote.outputs.update_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: "temurin"
      - id: m2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-release-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-m2-release-
      - name: Compute next snapshot version
        id: next
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          BASE="${TAG#v}"
          NEXT="${BASE%.*}.$(( ${BASE##*.} + 1 ))-SNAPSHOT"
          NEXT_BASE="${NEXT%-SNAPSHOT}"
          MAIN_POM=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          MAIN_BASE="${MAIN_POM%-SNAPSHOT}"
          if [ "$(printf '%s\n%s' "$MAIN_BASE" "$NEXT_BASE" | sort -V | tail -1)" = "$MAIN_BASE" ] \
            && [ "$MAIN_BASE" != "$NEXT_BASE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main is already at ${MAIN_POM}; skipping bump to ${NEXT}"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
      - run: ./mvnw -q versions:set -DnewVersion=${{ steps.next.outputs.version }} -DgenerateBackupPoms=false
        if: steps.next.outputs.skip != 'true'
      - name: Open bump PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          if git diff --quiet -- pom.xml; then
            echo "pom.xml is already at ${NEXT}; nothing to bump"
            exit 0
          fi
          BRANCH="chore/bump-${NEXT}"
          # The job checks out main (ref: main above), so HEAD is main's tip.
          BASE_SHA=$(git rev-parse HEAD)
          # main requires signed commits, and a commit pushed with GITHUB_TOKEN is unsigned, so
          # the commit is made through the API, which GitHub signs as github-actions[bot]. The
          # sign-off keeps the DCO check satisfied as well. The branch is created at main's tip,
          # or moved back to it when a rerun finds it, so each run starts the bump from main.
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="$BASE_SHA" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$BASE_SHA" -F force=true >/dev/null
          fi
          additions=$(git diff --name-only -z | while IFS= read -r -d '' path; do
            jq -n --arg path "$path" --arg contents "$(base64 -w0 "$path")" '{path: $path, contents: $contents}'
          done | jq -s .)
          commit=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$BASE_SHA" \
            --arg headline "chore: bump version to ${NEXT} after ${TAG}" \
            --arg body "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --argjson additions "$additions" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline, body: $body},
                fileChanges: {additions: $additions}}}}' \
            | gh api graphql --input - -q '.data.createCommitOnBranch.commit.oid')
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}" -q '.commit.verification.verified')
          if [ "$verified" != "true" ]; then
            echo "::error::Bump commit ${commit} is not signed; main requires signed commits."
            exit 1
          fi
          echo "Signed bump commit ${commit} on ${BRANCH}"
          # Branch on the outcome instead of masking every failure: success or an
          # already-existing PR is fine; anything else (e.g. the "Allow GitHub
          # Actions to create and approve pull requests" repo setting being off)
          # fails loudly so the bump is never silently lost. The branch is already
          # pushed, so the PR can still be opened by hand. See docs/RELEASING.md.
          if out=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: bump version to ${NEXT}" \
            --body "Moves main to ${NEXT} after ${TAG}." 2>&1); then
            echo "Opened bump PR: ${out}"
          elif printf '%s\n' "${out}" | grep -qi 'already exists'; then
            echo "Bump PR for ${BRANCH} already exists; nothing to do"
          else
            echo "::error::Failed to open bump PR: ${out}"
            exit 1
          fi
      - if: ${{ success() && steps.m2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ steps.m2.outputs.cache-primary-key }}

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  # Did this change touch anything other than docs (*.md, docs/**)? The native build and image
  # publish (main only) are skipped for docs-only commits. Fails open — anything uncertain
  # (first push, missing parent, a multi-file change) counts as code, so a real change is never
  # skipped. Note: a docs-only main commit then has no per-SHA image, so do not cut a release
  # from one (the release workflow verifies the image exists).
  #
  # `native` narrows `code` to the inputs the native image is built from: pom.xml, main sources
  # and resources (reflection, resource loading and serialization fail natively before they fail
  # on the JVM), the Dockerfiles, the native integration tests (#671), and this workflow, which
  # holds the build command. A pull
  # request builds the native image only when it touches one of those (#792); main always does.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          # A push diffs the pushed range. A pull request diffs its merge commit against the base
          # tip, which is the pull request's own change set: event.before is unset on `opened`,
          # and on `synchronize` names the previous head, whose diff to the new merge commit also
          # carries everything the base branch gained in between.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            from="$BASE"
            range=("${BASE}...${SHA}")
          else
            from="$BEFORE"
            range=("$BEFORE" "$SHA")
          fi
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${range[@]}")
          code=true
          native=true
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/)' || code=false
            printf '%s\n' "$changed" \
              | grep -qE '^(pom\.xml$|src/main/(java|resources|docker)/|src/test/java/dev/thiagogonzaga/thrillhousebot/nativeimage/|\.github/workflows/ci\.yml$)' \
              || native=false
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "native=${native}" >> "$GITHUB_OUTPUT"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # spotbugs runs here, off the test job's critical path. It analyzes main classes, so
      # compile first; spotless needs no compile.
      - run: ./mvnw clean compile spotbugs:check spotless:check -q

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # release.yml references the trivy-scan composite through a runtime
      # side-path (./.actions-ref/.github/actions/...) populated by a sparse
      # checkout, so that path does not exist at lint time. Mirror it with a
      # symlink so actionlint resolves and validates the release-gate scan's
      # inputs too — those scans are otherwise never exercised on PR CI.
      - name: Mirror release.yml side-path for the trivy-scan composite
        run: |
          mkdir -p .actions-ref/.github
          ln -s "$PWD/.github/actions" .actions-ref/.github/actions
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      # shellcheck ships on ubuntu-latest, so actionlint also lints inline run: scripts.
      - name: Lint workflows and composite actions
        run: ./actionlint -color

  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # One reactor: build + test + coverage report in a single Maven run (spotbugs moved to the
      # format job). Avoids re-starting Maven and recompiling across separate invocations.
      - run: ./mvnw clean test jacoco:report
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: devops-thiago/thrillhousebot
          fail_ci_if_error: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarCloud Scan
        # SonarCloud's free/community plan analyzes only the main branch and pull requests.
        # Run it on pushes to main and on same-repo PRs; skip pushes to develop/release/**,
        # where branch analysis is unavailable and the scan would fail.
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw sonar:sonar

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --production --audit-level=high
        working-directory: frontend
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/out/

  # main builds on every code change, since the image publish below consumes the binaries. A
  # pull request builds when it touches something the native image is made from (#792), so a
  # change that links on the JVM and fails natively is caught before it reaches main. The gate
  # is a job-level `if`, like every other conditional job here: a skipped run reports a
  # `skipped` conclusion, which satisfies a required check. Pushes to release/** build too, so a
  # release branch is never cut from a binary nobody booted; a tag promotes the image main built
  # here, which passed these same tests.
  #
  # The binary is then booted and driven by the @QuarkusIntegrationTest suite (#671), so what is
  # tested is what ships: linking alone does not catch a missing reflection registration or
  # resource. The prod binary is built for PostgreSQL, hence the service. Build and tests are
  # separate steps, and the job summary names which one failed, so a native-only failure reads
  # apart from a JVM test failure.
  native-build:
    needs: [frontend, changes]
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') ||
       (github.event_name == 'pull_request' && needs.changes.outputs.native == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # 16-alpine
        env:
          POSTGRES_DB: thrillhouse
          POSTGRES_USER: thrillhouse
          POSTGRES_PASSWORD: thrillhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thrillhouse -d thrillhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: src/main/resources/META-INF/resources/dashboard/
      - name: Build native image
        id: build
        run: ./mvnw package -Pnative -DskipTests -Dquarkus.native.container-build=true
      # failsafe alone, on the binary the step above built: the unit tests already ran in `test`.
      - name: Native integration tests
        id: it
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/thrillhouse
          QUARKUS_DATASOURCE_USERNAME: thrillhouse
          QUARKUS_DATASOURCE_PASSWORD: thrillhouse
        run: ./mvnw -Pnative failsafe:integration-test failsafe:verify
      - name: Job summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          BUILD: ${{ steps.build.outcome }}
          IT: ${{ steps.it.outcome }}
        run: |
          {
            echo "### Native image (${ARCH})"
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Native build | ${BUILD} |"
            echo "| Native integration tests | ${IT} |"
            report=target/failsafe-reports/failsafe-summary.xml
            if [ -f "$report" ]; then
              tag() { sed -n "s:.*<$1>\([0-9]*\)</$1>.*:\1:p" "$report"; }
              echo
              echo "Tests: $(tag completed) run, $(tag failures) failed, $(tag errors) errored, $(tag skipped) skipped."
            fi
            echo
            if [ "$BUILD" = failure ]; then
              echo "The native compilation failed: look for missing reflection, resource or build-time initialization registration (AGENTS.md, Native image)."
            elif [ "$IT" = failure ]; then
              echo "The binary built but failed against the integration tests: a native-only failure if the JVM \`test\` job passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.it.outcome == 'failure'
        with:
          name: native-it-reports-${{ matrix.arch }}
          path: target/failsafe-reports/
      # Only the main-branch image publish consumes the binaries; a pull request build proves
      # the link and keeps nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: native-binary-${{ matrix.arch }}
          path: target/*-runner

  docker:
    needs: [native-build, test, format]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-binary-amd64
          path: target/amd64/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-binary-arm64
          path: target/arm64/
      - run: chmod +x target/amd64/*-runner target/arm64/*-runner
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: devops-thiago
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags from pom version
        id: tags
        run: |
          VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text)
          ")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE_VER="${VERSION%-SNAPSHOT}"
          VERSIONED_SNAPSHOT="v${BASE_VER}-${SHORT_SHA}-snapshot"
          IMG="ghcr.io/devops-thiago/thrillhousebot"
          BASE_TAGS="${VERSIONED_SNAPSHOT} snapshot ${GITHUB_SHA}"
          default=""; distroless=""
          for t in $BASE_TAGS; do
            default="$default,$IMG:$t"
            distroless="$distroless,$IMG:$t-distroless"
          done
          echo "default=${default#,}" >> "$GITHUB_OUTPUT"
          echo "distroless=${distroless#,}" >> "$GITHUB_OUTPUT"
      - name: Build & push default image (UBI9)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/main/docker/Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.default }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push distroless image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/main/docker/Dockerfile.runtime-distroless
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.distroless }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # Trivy's Maven analyzer fetches any POM missing from ~/.m2; a partial cache still fans out
      # enough Central requests to trip a 429 IP block. dependency:resolve (not go-offline) covers
      # the POM set Trivy's SBOM pass actually reads — see trivy.dev troubleshooting / Maven 429.
      - name: Populate local Maven repository
        run: ./mvnw -q -B dependency:resolve
      - uses: ./.github/actions/trivy-scan
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          category: trivy-fs
          upload: ${{ github.event_name == 'push' }}

  trivy-image:
    needs: [docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: devops-thiago
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: ghcr.io/devops-thiago/thrillhousebot:${{ github.sha }}
          category: trivy-image
      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: ghcr.io/devops-thiago/thrillhousebot:${{ github.sha }}-distroless
          category: trivy-image-distroless

  docker-pr:
    needs: [frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: src/main/resources/META-INF/resources/dashboard/
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build JVM package for Docker validation
        run: ./mvnw package -DskipTests -Dquarkus.package.jar.type=mutable-jar
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: false
          tags: ghcr.io/devops-thiago/thrillhousebot:pr-${{ github.event.pull_request.number }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

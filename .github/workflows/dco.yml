name: DCO

# Checks author sign-offs or equivalent certified source-PR contributions for
# GitHub squash commits (Developer Certificate of Origin, see CONTRIBUTING.md). Commits
# authored by Dependabot or GitHub Actions are exempt in pull requests that bot
# opened, so a commit cannot skip the check by claiming a bot's address.
on:
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test DCO validator
        run: node --test scripts/dco/check.test.mjs
      - name: Check sign-offs and squash provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DCO_EVIDENCE_FILE: ${{ runner.temp }}/dco-evidence.json
        run: node scripts/dco/check.mjs
      - name: Preserve DCO evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dco-evidence
          path: ${{ runner.temp }}/dco-evidence.json
          if-no-files-found: ignore

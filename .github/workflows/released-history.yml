name: Released history

# A released version's CHANGELOG section and its archived docs (website/src/content/docs/<v>/,
# website/src/assets/<v>/, website/src/content/versions/<v>.json and its versions.json entry)
# record what shipped. This check fails a pull request that edits, removes, renames or adds to
# any of them for a version with a vX.Y.Z tag; a correction goes into the next release as an
# Errata entry. Adding a new release section or a new archive is allowed.
#
# pull_request_target, so this file and the checker always come from the base branch: under
# pull_request a pull request runs its own copy of the workflow and could rewrite the check it is
# held to. Nothing from the pull request is executed here: its commits are fetched as git objects
# and only read through git diff and git show. The checker's tests, which do run the pull
# request's code, run in ci.yml under pull_request.
on:
  pull_request_target:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  released-history:
    name: released-history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request's commits without checking them out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          test "$(git rev-parse refs/remotes/pull/head)" = "$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check released CHANGELOG sections and archived docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/released-history/check.mjs

name: Fuzzing

# Runs the Jazzer fuzz targets under src/fuzz/java in fuzzing mode for a bounded time each. The
# same targets run on every build as plain tests over their seed inputs
# (src/test/resources/**/*FuzzTestInputs); this workflow is what generates new inputs.
#
# Jazzer fuzzes one target per JVM, so each target is a matrix job. A finding fails the job and
# the input that caused it is uploaded as an artifact: add it to the target's inputs directory
# with the fix, and it becomes a regression test. The generated corpus is cached between runs so
# a run continues from what earlier ones reached.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to fuzz each target (Jazzer duration, for example 5m or 1h)"
        type: string
        default: "5m"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - "PatchIndexFuzzTest#parsesAnyPatch"
          - "SourceLineCodeFuzzTest#readsAnyLine"
          - "RepoSettingsParserFuzzTest#parsesAnyDocument"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-test-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-m2-test-
            ${{ runner.os }}-m2-
      - name: Restore the generated corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cifuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      # JaCoCo is skipped because its agent and Jazzer's both instrument the classes. snakeyaml is
      # instrumented as well so coverage guides the fuzzer through the YAML parser, not only
      # through the code that reads its result.
      - name: Fuzz
        env:
          JAZZER_FUZZ: "1"
          TARGET: ${{ matrix.target }}
          DURATION: ${{ inputs.duration || '5m' }}
        run: |
          ./mvnw -B test -Djacoco.skip=true -Dtest="$TARGET" \
            -Djazzer.max_duration="$DURATION" \
            -Djazzer.instrumentation_includes='dev.thiagogonzaga.**:org.yaml.snakeyaml.**'
      - name: Upload the failing input
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ strategy.job-index }}
          path: |
            src/test/resources/**/crash-*
            src/test/resources/**/timeout-*
            src/test/resources/**/oom-*
          if-no-files-found: ignore
          retention-days: 30
      - name: Save the generated corpus
        if: ${{ always() && hashFiles('.cifuzz-corpus/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cifuzz-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
